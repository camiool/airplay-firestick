name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AirPlayFire.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirPlayFire-apk
          path: AirPlayFire.apk

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AirPlay Fire (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: AirPlayFire.apk
          body: |
            APK para Fire TV compilado desde `${{ github.ref_name }}` (${{ github.sha }}).
            Enlace estable a la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/AirPlayFire.apk
